AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TechNexus - Network stack (pass-through variant). This account's Service
  Control Policy denies ec2:CreateVpc / CreateInternetGateway / etc., so this
  stack no longer creates a VPC — it references the account's existing
  (default) VPC and two of its subnets instead, and re-exports them under the
  same names the database/backend stacks already expect. Deploy once per
  environment (Dev, UAT).
  NOTE: because only public subnets are available here (no NAT Gateway, for
  the same SCP reason), PrivateSubnet1/2 below point at the SAME public
  subnets as PublicSubnet1/2. This is a sandbox-trial simplification, not a
  security downgrade for RDS (RDS stays non-publicly-accessible regardless of
  which subnets it sits in), but the ECS service must run with
  AssignPublicIp: ENABLED as a result — see 03-backend-ecs.yaml.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, uat, prod]
    Description: Logical environment this stack belongs to.

  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID of the account's existing (e.g. default) VPC to deploy into.

  ExistingSubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: First existing public subnet ID (different AZ from the second).

  ExistingSubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Second existing public subnet ID (different AZ from the first).

Resources:
  # CloudFormation requires at least one resource per stack. This is a
  # harmless no-op placeholder so the stack has something to create/track;
  # it costs nothing and does nothing.
  Placeholder:
    Type: AWS::CloudFormation::WaitConditionHandle

Outputs:
  VpcId:
    Value: !Ref ExistingVpcId
    Export:
      Name: !Sub technexus-${EnvironmentName}-VpcId
  PublicSubnet1:
    Value: !Ref ExistingSubnetId1
    Export:
      Name: !Sub technexus-${EnvironmentName}-PublicSubnet1
  PublicSubnet2:
    Value: !Ref ExistingSubnetId2
    Export:
      Name: !Sub technexus-${EnvironmentName}-PublicSubnet2
  PrivateSubnet1:
    # Same subnet as PublicSubnet1 — see note above.
    Value: !Ref ExistingSubnetId1
    Export:
      Name: !Sub technexus-${EnvironmentName}-PrivateSubnet1
  PrivateSubnet2:
    # Same subnet as PublicSubnet2 — see note above.
    Value: !Ref ExistingSubnetId2
    Export:
      Name: !Sub technexus-${EnvironmentName}-PrivateSubnet2
